site_name: GlyphMark docs
site_description: Usage documentation for GlyphMark — text watermarking over ASCII/Unicode channels, from the CLI and the web UI.
site_url: http://127.0.0.1:8123/docs/
docs_dir: docs
use_directory_urls: false          # flat *.html so the Flask app can serve /docs/<page>.html

theme:
  name: material
  language: en
  # No webfonts: the site has to render under the app's local-only CSP.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys:
      separator: "\_+"
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - CLI reference: cli.md
  - Web UI guide: ui.md
  - Channels: channels.md
  - Detection & sanitization: defence.md
  - HTTP API: api.md
  - Reference: reference.md
  - Responsible use: ethics.md
  - "← Back to the lab": /
