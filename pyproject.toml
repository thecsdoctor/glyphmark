[project]
name = "glyphmark"
version = "0.1.0"
description = "Text watermarking toolkit over ASCII/Unicode channels: embed, extract, detect, sanitize. Identical functionality from the CLI (non-interactive) and a Flask web UI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "GlyphMark" }]
keywords = ["steganography", "watermarking", "unicode", "provenance", "detection", "flask"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "click>=8.1",
    "flask>=3.0",
    "rich>=13.7",
]

[project.scripts]
glyphmark = "glyphmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphmark"]

# docs sources ship in the sdist so `glyphmark docs build` works from a source install
[tool.hatch.build.targets.sdist]
artifacts = ["docs"]
include = ["src", "docs", "tests", "tools", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
