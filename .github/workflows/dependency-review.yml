name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Fails a PR that adds a dependency with a known advisory, or one under a licence that
      # conflicts with MIT distribution. Blocks the "just add one more package" supply-chain path.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Copyleft licences would contaminate an MIT-licensed redistribution.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, GPL-2.0, GPL-2.0-only, GPL-3.0, GPL-3.0-only
          comment-summary-in-pr: always
